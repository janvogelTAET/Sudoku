<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6d83f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Leanas Sudoku" />
    <title>Leanas Sudoku</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SudokuWeb.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />
    <script>
        // Theme vor dem ersten Rendern setzen (verhindert Aufblitzen im falschen Modus).
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('sudoku.theme'); } catch (e) { }
            if (theme !== 'light' && theme !== 'dark')
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#1b1b30' : '#6d83f2');
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div>Leanas Sudoku wird geladenâ€¦</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ein Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">ðŸ—™</span>
    </div>
    <script src="js/interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        sudokuInterop.registerServiceWorker('service-worker.js');
    </script>
</body>

</html>
